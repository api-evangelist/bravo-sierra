aid: bravo-sierra
name: Bravo Sierra
description: >-
  Bravo Sierra is an American personal care company founded in New York City in
  2018, building high-performance, clean body care for the most active people.
  Its "military-native" line — deodorant, body wash, cleansing bars, body
  fragrance, hair styling paste, and antibacterial body wipes — is designed and
  field-tested with U.S. Special Operations Forces (starting with the 75th Ranger
  Regiment's 2nd Battalion) and manufactured in the USA. The direct-to-consumer
  brand runs on Shopify, offers subscriptions, and gives back a portion of every
  sale to programs supporting active service members, veterans, and their
  families. It was added to the API Evangelist network as a portfolio company of
  Canaan Partners; it publishes a consumer e-commerce storefront rather than a
  public developer API, so this profile captures identity and the store's
  first-party well-known discovery and domain-security surface.
